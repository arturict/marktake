packages:
  - apps/*
  - packages/*

injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - vite@7.0.7 || 7.0.8 || 7.3.2 || 7.3.5
  - playwright@1.55.1
  - fastify@5.7.2 || 5.7.3 || 5.8.3 || 5.8.5
  - file-type@21.3.1 || 21.3.2
  - "@fastify/static@9.1.1 || 10.1.1 || 10.1.2"
  - vitest@3.2.6
  - brace-expansion@1.1.17 || 5.0.8

overrides:
  "brace-expansion@>=1.1.7 <2.0.0": 1.1.17
  "brace-expansion@>=2.0.0 <3.0.0": 2.1.3
  "brace-expansion@>=3.0.0 <4.0.0": 3.0.5
  "brace-expansion@>=4.0.0 <5.0.0": 4.0.1
  "brace-expansion@>=5.0.0 <=5.0.7": 5.0.8
