name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run static, test, and build gates
        run: pnpm check
      - name: Enforce core coverage
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.16.0
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies and browsers
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Build release image
        run: docker build --tag marktake:ci .
      - name: Generate synthetic CFR fixture
        run: |
          mkdir -p work/fixtures
          chmod 777 work/fixtures
          docker run --rm --user root --entrypoint ffmpeg \
            --volume "$PWD/work/fixtures:/fixtures" marktake:ci \
            -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=1280x720:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 3 -c:v libx264 -pix_fmt yuv420p -r 24 -c:a aac \
            -movflags +faststart /fixtures/marktake-test.mp4
      - name: Start release image
        run: |
          docker run --detach --name marktake-e2e --publish 4180:4180 \
            --env MARKTAKE_ADMIN_PASSWORD=ci-browser-test-password \
            --env MARKTAKE_PUBLIC_URL=http://127.0.0.1:4180 \
            marktake:ci
          for attempt in $(seq 1 40); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' marktake-e2e)" = "healthy" ]; then
              exit 0
            fi
            sleep 1
          done
          docker logs marktake-e2e
          exit 1
      - name: Run creator and guest journey
        env:
          MARKTAKE_E2E_URL: http://127.0.0.1:4180
          MARKTAKE_E2E_ADMIN_PASSWORD: ci-browser-test-password
          MARKTAKE_E2E_SYSTEM_CHROME: "true"
        run: pnpm e2e
      - name: Verify the static landing page
        run: |
          pnpm --filter @marktake/landing build
          pnpm --filter @marktake/landing exec vite preview \
            --host 127.0.0.1 --port 4175 > /tmp/marktake-landing.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4175/ > /dev/null; then
              pnpm --filter @marktake/landing verify
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marktake-landing.log
          exit 1
      - name: Show container logs
        if: always()
        run: docker logs marktake-e2e || true
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            apps/landing/work/landing-verification/
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
